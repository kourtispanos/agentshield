[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.0.1"
description = "A runtime firewall for AI agents"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["kivy>=2.3.0"]
mcp = ["mcp>=2.0"]

[tool.setuptools]
packages = ["backend", "backend.attack", "backend.defense", "backend.database"]
